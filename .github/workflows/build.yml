name: Build

on:
  push:
  pull_request:

jobs:
  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - run: npm ci
        working-directory: workbench
      - run: npm run build
        working-directory: workbench
